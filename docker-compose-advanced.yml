# Advanced compose file for Kojent Frigate - Includes MQTT Environment Variables
# Uses Docker named volumes by default. Edit .env file to customize or use bind mounts.
version: '3.9'

# Defines named volumes used if CONFIG_VOLUME/MEDIA_VOLUME aren't overridden with host paths in .env
volumes:
  ${CONFIG_VOLUME:-frigate_config}: # Default named volume for /config
  ${MEDIA_VOLUME:-frigate_storage}: # Default named volume for /media/frigate

services:
  # Use 'kojent-frigate' or your actual fork name
  frigate:
    container_name: ${CONTAINER_NAME:-kojent-frigate}
    image: ${KOJENT_IMAGE:-kojensy/kojent-frigate:latest}
    restart: unless-stopped
    privileged: true
    shm_size: ${SHM_SIZE:-1g}
    environment:
      - TZ=${TZ:-UTC} # Set your timezone via .env if needed (e.g., America/Denver)
      # --- MQTT Configuration (Values MUST be set in .env file) ---
      - MQTT_HOST=${MQTT_HOST}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_PORT=${MQTT_PORT:-1883} # Default MQTT port
      # ---------------------------------------------------------
    devices:
      # --- Optional: Uncomment lines below if you use Coral devices or HW Accel ---
      # Ensure the correct device path for your host system is used.
      # - /dev/bus/usb:/dev/bus/usb # For Coral USB
      # - /dev/dri:/dev/dri         # For Intel QuickSync (might be /dev/dri/renderD128)
      # - /dev/apex_0:/dev/apex_0   # For Coral PCIe
    volumes:
      - /etc/localtime:/etc/localtime:ro # Sync timezone with host
      # --- Volume Setup (See .env.example and README.md) ---
      # By default uses named volumes defined above.
      # Edit .env file to override with host paths for bind mounts if preferred.
      - ${CONFIG_VOLUME:-frigate_config}:/config
      - ${MEDIA_VOLUME:-frigate_storage}:/media/frigate
      # ----------------------------------------------------
    ports:
      - "${WEB_PORT:-5000}:5000" # Frigate Web UI port
    # Optional GPU reservation (requires Docker setup)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]

  # NOTE: This file only includes Frigate. Users are expected to have
  # Mosquitto and Home Assistant running separately. A full stack example
  # including those could be provided elsewhere if desired.

